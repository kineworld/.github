name: Guide checks

# This repository publishes the guards in guards/ and requires them of every caller, but
# until now it did not use one itself: the labs suite was run, and nothing checked that the
# run collected every test the files define. See kineworld/.github#10.
#
# Each added step can fail, and the defect it catches is specific:
#
#   - the copy check catches an edit to world-models/labs/check_collection.py that was not
#     also made in guards/check_collection.py. It runs first because a guard that is itself
#     out of date would give the last step a wrong verdict.
#   - the collection guard catches a `test_*` function written at module level (invisible to
#     `discover`) or a test module that cannot be imported. It runs last because the suite
#     above reports the import error in plain language, and the guard's verdict is a count.
#
# Both are cheap here in a way they are not for other repositories: the canonical file is in
# this checkout, so the comparison needs no network.

on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm the labs guard is the canonical copy
        # Carriage returns are stripped before comparing, for the same reason
        # python-tests.yml does it: a Windows checkout with core.autocrlf is a property of
        # the machine, not drift in the file, and reporting it as drift sends the person to
        # the wrong fix.
        run: |
          set -eu
          tr -d '\r' < guards/check_collection.py > /tmp/canonical
          tr -d '\r' < world-models/labs/check_collection.py > /tmp/copy
          if ! cmp -s /tmp/canonical /tmp/copy; then
            echo "::error file=world-models/labs/check_collection.py::This file has drifted from guards/check_collection.py. Re-copy it: cp guards/check_collection.py world-models/labs/check_collection.py"
            diff -u --label guards/check_collection.py --label world-models/labs/check_collection.py /tmp/canonical /tmp/copy || true
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s world-models/labs -p 'test_*.py' -v
      - run: python world-models/labs/check_docs.py
      - run: python world-models/labs/tiny_world.py --seed 7
      - run: python world-models/labs/partial_observation.py
      - name: Confirm every test in world-models/labs is visible to the runner
        run: python world-models/labs/check_collection.py
