name: Community files

# These files are organization-wide defaults: GitHub serves each one to every repository in the
# organization that does not ship its own copy. A broken link or a deleted file here degrades
# every repository at once, and no individual repository's CI would catch it. So this workflow
# runs on the defaults themselves.

on:
  push:
  pull_request:
  schedule:
    # Weekly, so that link rot in the defaults is noticed without anyone opening a pull request.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Both actions are pinned to full commit SHAs, not mutable tags. Keep that property:
      # SECURITY.md treats a tag reference in this repository as a defect.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # PyYAML lets the check validate the issue-form structure, not just their syntax.
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - run: python scripts/check_community_files.py
